name: Deploy Vite React to GitHub Pages

on:
  push:
    branches:
      - deploy_test  # deploy when main is updated

permissions:
  contents: write  # give workflow permission to push

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build -- --base=https://github.com/asdf154/long_senior_fair_frontend/

      - name: Fix SPA routing
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # Initialize gh-pages branch if it doesn't exist
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages || git checkout gh-pages
          
          # Remove old files
          git rm -rf . || true
          
          # Copy build files
          cp -r dist/* .
          
          git add .
          git commit -m "Deploy React app"
          git push -u origin gh-pages --force
